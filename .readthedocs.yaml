# ReadTheDocs configuration — https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# ReadTheDocs does not execute the examples. Right after the checkout,
# docs/fetch_gallery.sh downloads the gallery already built by the
# docs-gallery workflow (stored on the dedicated docs-gallery branch)
# and checks that it was built from this commit's examples, source and
# gallery configuration. If it was not, the build is cancelled and the
# pages already online stay; the workflow starts the build again when
# the gallery is ready. The sphinx-gallery MD5 cache then recognises the
# pages as current, so the build assembles the site without running any
# script and stays inside the time limit; docs/conf.py stops the build
# if any example would still have to run.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      - bash docs/fetch_gallery.sh

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# Every version can also be downloaded as a zipped copy of its HTML.
formats:
  - htmlzip
