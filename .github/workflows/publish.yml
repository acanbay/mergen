# Publishes the package to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing (OIDC), so no API token is stored in the
# repository. The same release also triggers the Zenodo archive through
# the Zenodo-GitHub integration, and conda-forge picks up the new PyPI
# version through its feedstock bot.
name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -Po '^__version__ = "\K[^"]+' src/mergen/__init__.py)
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      - name: Build sdist and wheel
        run: python -m pip install --upgrade build && python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mergen-doe/
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
